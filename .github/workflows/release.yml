name: Release

# Pushing a version tag (v1.2.3) that points at a commit on main publishes a
# GitHub release with the portable downloads. The tag must match the version
# in Cargo.toml, and CHANGELOG.md must have a section for it.
#
# Pull requests that change the release files build the downloads the same
# way, without publishing, so the process is exercised before a tag needs it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - packaging/**
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af

jobs:
  prepare:
    name: Check version and gather notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "version=$(scripts/release/version.sh)" >> "$GITHUB_OUTPUT"

      - name: The tag matches the version and is on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG doesn't match version $VERSION in Cargo.toml."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $TAG points at a commit that isn't on main."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: |
          mkdir -p dist
          scripts/release/notes.sh "${{ steps.version.outputs.version }}" > dist/release-notes.md

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install cargo-about
        run: |
          name=cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/about.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/about.tar.gz" -C "$RUNNER_TEMP"
          echo "CARGO_ABOUT=$RUNNER_TEMP/$name/cargo-about" >> "$GITHUB_ENV"

      - name: Third-party licenses
        run: scripts/release/notices.sh

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: |
            dist/release-notes.md
            dist/THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          # The oldest supported Ubuntu, so the AppImage runs on older
          # distributions too.
          - platform: linux
            os: ubuntu-22.04
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux webview and AppImage prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: dist

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = windows ]; then
            npx tauri build --no-bundle
          else
            npx tauri build
          fi

      - name: Pack
        id: pack
        shell: bash
        run: echo "file=$(scripts/release/package.sh ${{ matrix.platform }})" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: download-${{ matrix.platform }}
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: download-*
          merge-multiple: true
          path: assets

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: notes

      - name: Checksums
        run: |
          cp notes/THIRD-PARTY-LICENSES.html assets/
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "SpaceBadger $VERSION" \
            --notes-file notes/release-notes.md
