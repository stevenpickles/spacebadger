[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
repository = "https://github.com/stevenpickles/spacebadger"

[workspace.dependencies]
sb-core = { path = "crates/sb-core" }
sb-scan = { path = "crates/sb-scan" }
sb-protocol = { path = "crates/sb-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = "=12.0.1"
tauri = "=2.12.1"
tauri-build = "=2.7.1"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
